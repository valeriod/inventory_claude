name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  test:
    name: Test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://inventory:inventory@localhost:5432/inventory_test' || 'sqlite::memory:' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          tags: inventory:ci
          load: true
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Refuses to start on a public bind without auth
        run: |
          if docker run --rm inventory:ci; then
            echo "expected container to exit with a config error"; exit 1
          fi
      - name: Serves health check and SPA
        run: |
          docker run -d --name inv -p 3000:3000 -e ALLOW_NO_AUTH=true inventory:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:3000/api/health && break
            sleep 1
          done
          curl -fsS localhost:3000/api/health | grep '"database":"sqlite"'
          curl -fsS localhost:3000/items/TEST | grep -i '<html'
          # pdfkit is installed next to the bundle in the image: render a label PDF
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"name":"Smoke bin","code":"SMOKE-1"}' localhost:3000/api/locations
          curl -fsS 'localhost:3000/api/labels?locations=SMOKE-1' | head -c 5 | grep -- '%PDF-'
      - if: always()
        run: docker logs inv || true

  compose:
    name: Compose deployments (Caddy HTTPS, Postgres, backups, transfer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SQLite behind Caddy (internal CA), with a password
        run: |
          cat > .env <<'ENV'
          CADDYFILE=Caddyfile.lan
          SITE_ADDRESS=localhost
          APP_PASSWORD=ci-password
          SESSION_SECRET=ci-session-secret-0123456789abcdef
          ENV
          docker compose --env-file .env -f docker/compose.yml -f docker/compose.caddy.yml up -d --build --wait
          for i in $(seq 1 30); do curl -kfsS https://localhost/api/health && break; sleep 1; done
          curl -kfsS https://localhost/api/health | grep '"database":"sqlite"'
          # The app is not published on the host; only Caddy is.
          if curl -fsS localhost:3000/api/health; then echo "app port should not be published"; exit 1; fi
          # Security headers and HTML shell through the proxy
          curl -ksSI https://localhost/items | grep -i '^content-security-policy:'
          # Password login over HTTPS sets a Secure cookie
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/api/units)" = 401
          curl -ksS -c jar -H 'content-type: application/json' -d '{"password":"ci-password"}' \
            https://localhost/api/auth/login -D - | grep -i 'set-cookie:.*secure'
          curl -kfsS -b jar https://localhost/api/units > /dev/null
          # Backups via the CLI land in ./data/backups
          docker compose --env-file .env -f docker/compose.yml -f docker/compose.caddy.yml exec -T -u node app node dist/cli.js backup
          ls data/backups | grep -E '^inventory-[0-9]{8}-[0-9]{6}\.db$'
      - if: always()
        run: docker compose --env-file .env -f docker/compose.yml -f docker/compose.caddy.yml logs || true
      - name: Postgres variant, export and transfer
        run: |
          docker compose --env-file .env -f docker/compose.yml -f docker/compose.caddy.yml down
          sudo rm -rf data
          rm .env   # no password for this step (compose.yml reads .env when present)
          export POSTGRES_PASSWORD=ci-postgres
          docker compose -f docker/compose.yml -f docker/compose.postgres.yml up -d --build --wait
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health && break; sleep 1; done
          curl -fsS localhost:3000/api/health | grep '"database":"postgres"'
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"name":"CI bin","code":"CI-1"}' localhost:3000/api/locations
          # Postgres → JSON → fresh SQLite, inside the container
          docker compose -f docker/compose.yml -f docker/compose.postgres.yml exec -T -u node app sh -c \
            'node dist/cli.js transfer --from "$DATABASE_URL" --to /data/export.json.gz &&
             node dist/cli.js transfer --from /data/export.json.gz --to sqlite:///data/copy.db'
          docker compose -f docker/compose.yml -f docker/compose.postgres.yml exec -T -u node app node dist/cli.js backup
          ls data/backups | grep -E '^inventory-[0-9]{8}-[0-9]{6}\.json\.gz$'
      - if: always()
        run: docker compose -f docker/compose.yml -f docker/compose.postgres.yml logs || true

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
