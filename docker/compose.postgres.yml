# Postgres variant (override file):
#   POSTGRES_PASSWORD=… docker compose -f docker/compose.yml -f docker/compose.postgres.yml up -d --build
# Nightly backups are written as gzipped JSON to ./data/backups (restore with db:transfer).
services:
  app:
    environment:
      DATABASE_URL: postgres://inventory:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/inventory
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: inventory
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory -d inventory']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
